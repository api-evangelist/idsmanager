name: idsmanager
description: IDSManager (Jiuzhou Yunteng, 九州云腾) is a Chinese enterprise cybersecurity vendor providing
  unified identity management and zero-trust security. Its IDaaS platform centralizes account lifecycle,
  authentication, and authorization around a 5A framework (application center, unique accounts, single
  sign-on, centralized authorization, transparent auditing). The product line spans the IPG identity
  authentication series, MFA combining biometrics and digital certificates, the SPG secure application
  authentication series with Web and API gateways, and an SDP identity-defined perimeter for zero-trust
  access. It targets cloud migration, mobile-office security, and regulatory compliance across internet,
  finance, government, manufacturing, and education sectors. No public developer portal, API, or SDK is
  currently published.
